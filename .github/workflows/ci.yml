name: MCP

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  nix:
    name: nix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Flake check
        run: nix flake check --print-build-logs
      - name: Build wwn-mcp
        run: nix build .#wwn-mcp --print-build-logs
      - name: Smoke info + knowledge index + search
        run: |
          export WWN_MCP_DATA_DIR="$RUNNER_TEMP/wwn-mcp-data"
          mkdir -p "$WWN_MCP_DATA_DIR"
          nix run .#wwn-mcp -- info
          nix run .#wwn-mcp -- index --knowledge
          nix run .#wwn-mcp -- search "repo DAG L0 toolchain" --kind docs -k 3
          nix run .#wwn-mcp -- info

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff
        run: ruff check src
